name: CatBreak
options:
  bundleIdPrefix: com.catbreak
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  developmentLanguage: zh-Hans
  knownRegions:
    - zh-Hans
    - en

configs:
  Debug: debug
  Release: release
  AppStore: release

settings:
  base:
    PRODUCT_NAME: CatBreak
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES

targets:
  CatBreak:
    type: application
    platform: macOS
    sources:
      - path: Sources/CatBreak
        type: group
      - path: Resources
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catbreak.app
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          ENABLE_APP_SANDBOX: NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          ENABLE_APP_SANDBOX: NO
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
        AppStore:
          ENABLE_APP_SANDBOX: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
    entitlements:
      path: Configs/CatBreak.dmg.entitlements
      properties:
        com.apple.security.app-sandbox: false
